# This config file recursively defines other config files.
# This is a bit frustrating for readability and maintainability,
# but I will leave it in place until the batched trainer works.
## model section:
model_config:
  #deprecated don't be passing a second script like this, anymore it makes everything grody.
  #also overwrites keys we set here on purpose.
  #refpath: "trainscripts/imagesliders/data/config-xl-batchtest.yaml"
pretrained_model:
  #name_or_path: "stabilityai/stable-diffusion-xl-base-1.0" # you can also use .ckpt or .safetensors models
  name_or_path: "F:/dox/ai/stable-diffusion-1.5/models/Stable-diffusion/molKeunMix_v3NoobaiXL.safetensors"
  v2: false # true if model is v2.x
  v_pred: false # true if model uses v-prediction
network:
  type: "c3lier" # or "c3lier" or "lierla"
  rank: 32
  alpha: 32
  training_method: "noxattn"
train:
  seed: 42  #default training seed init
  lr: 0.00096
  lr_warmup_steps: 32
  lr_scheduler: "constant"  #or "constant" or "cosine"
  precision: "bfloat16"
  optimizer: "Adam8bit"
  noise_scheduler: "ddim" # or "ddpm", "lms", "euler_a", "ddim"
  max_denoising_steps: 50
  resolution: [512, 512]  #read from here for some reason
  iterations: 2
  gradient_accumulation_steps: 4
  batch_size: 4 #now must be assigned here
  bounds_test_vae_batch_size: true
  vae_encoding_batch_size: 20
  invalidate_latent_cache: false
  estimate_gradient_noise_scale: true
  gns_profile_freq: 4
  gns_ema_alpha: 0.02
save:
  name: "molKM_IL_imageslider_b" #used!
  path: "./models"
  per_steps: 20
  precision: "bfloat16"
logging:
  use_wandb: false
  verbose: false
other:
  use_xformers: false
  use_pytorch_SDPA: false
  torch_compile: true
  lycorisize: false
  gradient_checkpointing: true

## dataset section
dset_config: #obsolete don't use this in future scripts
  refpath: "trainscripts/imagesliders/data/bracket_dataset.yaml"
dataset:
  #these attributes were passed by argparse in upstream
  #they should be passable by config file!
  #root folder for dataset
  folder_main:  "datasets/bracket"
  #folders with scale-separated subsets.
  #even if they have numbers for names, they can be assigned any scale
  folders: "0, 1, 2"
  #list assigning one magnitude to each subset folder
  scales: "0.15, 1, 2"
  prompts_file: "trainscripts/imagesliders/data/prompts-xl-dilora-bracket.yaml"