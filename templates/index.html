<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Loupe</title>
    <link rel="stylesheet" href="/templates/client_style.css">
</head><body>
    <header><h1>Dataset Loupe</h1></header>
    <main id="workbench">
        <div id="left-panel">
            <div class="panel-controls">
                <div class="control-group">
                    <label for="group-by-select">Group By:</label>
                    <select id="group-by-select">
                        <option value="work_item" selected>Work Item</option>
                        <option value="asset_type">Asset Type</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="filter-input">Filter:</label>
                    <input type="text" id="filter-input" placeholder="Filter current view...">
                </div>
            </div>
            <div id="primary-list-container" class="list-container">
                <p class="loader">Loading initial index...</p>
            </div>
        </div>
        <div id="right-panel">
            <div id="content-pane">
                <p class="placeholder">Select an item from the left to view details.</p>
            </div>
        </div>
    </main>
    <script src="/templates/client_actions.js"></script>
</body>
</html>
