[project]
name = "sliders"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.6.0",
    "bitsandbytes>=0.43.0",
    "colorama>=0.4.6",
    "dadaptation>=3.2",
    "diffusers>=0.33.1",
    "flash-attn==2.7.2.post1",
    "flask>=3.1.1",
    "ipython>=8.36.0",
    "lion-pytorch>=0.2.3",
    "lpips>=0.1.4",
    "lycoris-lora>=3.2.0.post2",
    "matplotlib>=3.10.3",
    "numpy>=2.2.5",
    "opencv-python>=4.11.0.86",
    "opencv-python-headless>=4.11.0.86",
    "pandas>=2.2.3",
    "pillow>=11.2.1",
    "prodigyopt>=1.1.2",
    "pydantic>=2.11.4",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "safetensors>=0.5.3",
    "setuptools>=80.4.0",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.67.1",
    "transformers>=4.51.3",
    "triton",
    "wandb>=0.19.11",
    "werkzeug>=3.1.3",
]

[tool.uv.sources]
triton = [
  # For Windows, use the custom pre-built wheel from GitHub releases
  { url = "https://github.com/woct0rdho/triton-windows/releases/download/v3.1.0-windows.post8/triton-3.1.0-cp310-cp310-win_amd64.whl", marker = "sys_platform == 'win32'" },
  # For other platforms (Linux, macOS, etc.), get triton from the default PyPI
  { index = "pypi", marker = "sys_platform != 'win32'" }, # <-- CHANGED THIS LINE
]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }


[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]] # <-- ADDED THIS SECTION
name = "pypi"
url = "https://pypi.org/simple/"
# explicit = false # You can optionally set explicit to false, but it's not strictly necessary if other dependencies aren't globally using this named index.